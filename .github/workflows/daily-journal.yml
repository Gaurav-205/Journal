name: Daily Coursework Journal Submission

# Runs when a written entry is pushed, so it is filed right away. Scheduled runs started
# 5-10 hours late, past the form's 11:59 PM deadline.
on:
  schedule:
    # 4:00 PM IST (16:00 IST) = 10:30 AM UTC, Monday–Friday
    - cron: '30 10 * * 1-5'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Fill the form without submitting'
        type: boolean
        default: false
  push:
    branches: [ main ]
    paths: [ 'entries/**' ]

permissions:
  contents: read

# Overlapping runs could both pass the once-per-day guard and submit twice.
concurrency:
  group: daily-journal
  cancel-in-progress: false

jobs:
  submit-journal:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      # Session caches are scoped to the secret's hash, so updating STORAGE_STATE_BASE64
      # after a fresh login takes effect instead of being shadowed by an expired cached session.
      - name: Fingerprint session secret
        id: session-secret
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        run: echo "hash=$(printf %s "$STORAGE_STATE_BASE64" | sha256sum | cut -c1-16)" >> "$GITHUB_OUTPUT"

      - name: Restore updated session state from cache
        id: session-cache
        uses: actions/cache/restore@v6
        with:
          path: storageState.json
          key: google-session-${{ steps.session-secret.outputs.hash }}-${{ github.run_id }}
          restore-keys: |
            google-session-${{ steps.session-secret.outputs.hash }}-

      # cache-hit is only true for an exact key match, never for a restore-keys match.
      - name: Decode storageState.json from Secret (fallback)
        if: steps.session-cache.outputs.cache-matched-key == ''
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        run: |
          if [ -z "$STORAGE_STATE_BASE64" ]; then
            echo "::error::STORAGE_STATE_BASE64 secret is missing or empty!"
            exit 1
          fi
          node -e 'fs.writeFileSync("storageState.json", Buffer.from(process.env.STORAGE_STATE_BASE64.replace(/\s+/g, ""), "base64"))'
          echo "storageState.json restored successfully from secret."

      - name: Get current date in target timezone
        id: date
        run: echo "today=$(node -e 'import("./src/entry.js").then(m => console.log(m.getFormattedToday(process.env.TIMEZONE || "Asia/Kolkata")))')" >> $GITHUB_OUTPUT
        env:
          TIMEZONE: ${{ secrets.TIMEZONE }}

      - name: Restore daily submission state from cache
        uses: actions/cache/restore@v6
        with:
          path: .last_submission.json
          key: journal-submitted-${{ steps.date.outputs.today }}

      - name: Run Journal Submission Script
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          STORAGE_STATE_PATH: storageState.json
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm start

      - name: Save daily submission state to cache
        if: success() && hashFiles('.last_submission.json') != ''
        uses: actions/cache/save@v6
        with:
          path: .last_submission.json
          key: journal-submitted-${{ steps.date.outputs.today }}

      - name: Save updated session state to cache
        if: success() && hashFiles('storageState.json') != ''
        uses: actions/cache/save@v6
        with:
          path: storageState.json
          key: google-session-${{ steps.session-secret.outputs.hash }}-${{ github.run_id }}
