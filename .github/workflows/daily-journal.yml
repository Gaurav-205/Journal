name: Daily Coursework Journal Submission

on:
  push:
    branches: [ main ]
  schedule:
    # 4:00 PM IST (16:00 IST) = 10:30 AM UTC, Monday–Friday only
    - cron: '30 10 * * 1-5'
  workflow_dispatch:

jobs:
  submit-journal:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Chromium
        run: npx playwright install chromium --with-deps

      - name: Restore updated session state from cache
        id: session-cache
        uses: actions/cache/restore@v4
        with:
          path: storageState.json
          key: google-session-${{ github.run_id }}
          restore-keys: |
            google-session-

      - name: Decode storageState.json from Secret (fallback)
        if: steps.session-cache.outputs.cache-hit != 'true'
        env:
          STORAGE_STATE_BASE64: ${{ secrets.STORAGE_STATE_BASE64 }}
        run: |
          if [ -z "$STORAGE_STATE_BASE64" ]; then
            echo "::error::STORAGE_STATE_BASE64 secret is missing or empty!"
            exit 1
          fi
          node -e 'fs.writeFileSync("storageState.json", Buffer.from(process.env.STORAGE_STATE_BASE64.replace(/\s+/g, ""), "base64"))'
          echo "storageState.json restored successfully from secret."

      - name: Get current date in target timezone
        id: date
        run: echo "today=$(node -e 'import("./src/summarizer.js").then(m => console.log(m.getFormattedToday(process.env.TIMEZONE || "Asia/Kolkata")))')" >> $GITHUB_OUTPUT
        env:
          TIMEZONE: ${{ secrets.TIMEZONE }}

      - name: Restore daily submission state from cache
        uses: actions/cache/restore@v4
        with:
          path: .last_submission.json
          key: journal-submitted-${{ steps.date.outputs.today }}

      - name: Run Journal Submission Script
        env:
          FORM_ID: ${{ secrets.FORM_ID }}
          ENTRY_MAP: ${{ secrets.ENTRY_MAP }}
          GH_OWNER: ${{ secrets.GH_OWNER }}
          GH_REPO: ${{ secrets.GH_REPO }}
          GH_USERNAME: ${{ secrets.GH_USERNAME }}
          COMMIT_READ_TOKEN: ${{ secrets.COMMIT_READ_TOKEN }}
          TIMEZONE: ${{ secrets.TIMEZONE }}
          STORAGE_STATE_PATH: storageState.json
          DISABLE_SUBMIT: "false"
          DRY_RUN: "false"
        run: npm start

      - name: Save daily submission state to cache
        if: success() && hashFiles('.last_submission.json') != ''
        uses: actions/cache/save@v4
        with:
          path: .last_submission.json
          key: journal-submitted-${{ steps.date.outputs.today }}

      - name: Save updated session state to cache
        if: success() && hashFiles('storageState.json') != ''
        uses: actions/cache/save@v4
        with:
          path: storageState.json
          key: google-session-${{ github.run_id }}
